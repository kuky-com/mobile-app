pluginManagement {
  // Find Node.js executable path
  def nodeExecutable = null
  def nodePaths = [
      "/usr/local/bin/node",
      "/opt/homebrew/bin/node", 
      "/Users/admin/.nvm/versions/node/v20.19.2/bin/node",
      System.getenv("NODE_BINARY") ?: "node"
  ]

  for (String nodePath : nodePaths) {
      if (new File(nodePath).exists()) {
          nodeExecutable = nodePath
          break
      }
  }

  if (nodeExecutable == null) {
      nodeExecutable = "node" // Fallback to system PATH
  }

  includeBuild(new File([nodeExecutable, "--print", "require.resolve('@react-native/gradle-plugin/package.json')"].execute(null, rootDir).text.trim()).getParentFile().toString())
}

plugins { id("com.facebook.react.settings") }

// Find Node.js executable path (for use outside pluginManagement block)
def nodeExecutable = null
def nodePaths = [
    "/usr/local/bin/node",
    "/opt/homebrew/bin/node", 
    "/Users/admin/.nvm/versions/node/v20.19.2/bin/node",
    System.getenv("NODE_BINARY") ?: "node"
]

for (String nodePath : nodePaths) {
    if (new File(nodePath).exists()) {
        nodeExecutable = nodePath
        break
    }
}

if (nodeExecutable == null) {
    nodeExecutable = "node" // Fallback to system PATH
}

extensions.configure(com.facebook.react.ReactSettingsExtension) { ex ->
  if (System.getenv('EXPO_USE_COMMUNITY_AUTOLINKING') == '1') {
    ex.autolinkLibrariesFromCommand()
  } else {
    def command = [
      nodeExecutable,
      '--no-warnings',
      '--eval',
      'require(require.resolve(\'expo-modules-autolinking\', { paths: [require.resolve(\'expo/package.json\')] }))(process.argv.slice(1))',
      'react-native-config',
      '--json',
      '--platform',
      'android'
    ].toList()
    ex.autolinkLibrariesFromCommand(command)
  }
}

rootProject.name = 'Kuky'

dependencyResolutionManagement {
  versionCatalogs {
    reactAndroidLibs {
      from(files(new File([nodeExecutable, "--print", "require.resolve('react-native/package.json')"].execute(null, rootDir).text.trim(), "../gradle/libs.versions.toml")))
    }
  }
}

apply from: new File([nodeExecutable, "--print", "require.resolve('expo/package.json')"].execute(null, rootDir).text.trim(), "../scripts/autolinking.gradle");
useExpoModules()

include ':app'
